<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İletişim | Aydede Hukuk Bürosu</title>
    <meta name="description" content="Aydede Hukuk Bürosu ile iletişime geçmek için telefon, e-posta ve form bilgileri." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-bar">
        <a class="brand" href="index.html">
          <img src="assets/brand/logo-full.png" alt="Aydede Hukuk Bürosu" />
        </a>
        <nav class="nav-links" aria-label="Ana navigasyon">
          <a href="index.html">Ana Sayfa</a>
          <a href="hakkimizda.html">Hakkımızda</a>
          <a href="hizmetler.html">Hizmetler</a>
          <a href="iletisim.html" class="active">İletişim</a>
        </nav>
      </div>
    </header>

    <main class="page-content">
      <section class="container page-header">
        <p class="section-label">İletişim</p>
        <h1>Hukuki desteğe hemen ulaşın.</h1>
      </section>

      <section class="container contact-grid">
        <article class="contact-card">
          <h3>İletişim bilgileri</h3>
          <p><strong>Telefon:</strong> +90 212 000 00 00</p>
          <p><strong>E-posta:</strong> info@aydedehukuk.com</p>
          <p><strong>Adres:</strong> İstanbul, Türkiye</p>
        </article>

        <article class="contact-card">
          <h3>İletişim formu</h3>
          <form class="contact-form">
            <input type="text" placeholder="Adınız Soyadınız" />
            <input type="email" placeholder="E-posta adresiniz" />
            <input type="tel" placeholder="Telefon numaranız" />
            <textarea rows="5" placeholder="Talebiniz hakkında kısa bilgi"></textarea>
            <button type="submit">Gönder</button>
          </form>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <p>© <span id="year"></span> Aydede Hukuk Bürosu</p>
        <a href="iletisim.html">İletişim</a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
